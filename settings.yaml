apiVersion: v1alpha1
kind: Setting
metadata:
  name: lyricall-setting
spec:
  forms:
    - group: style
      label: 样式
      formSchema:
        - $formkit: radio
          name: color_scheme
          label: 配色方案
          value: system
          options:
            - label: 跟随系统
              value: system
            - label: 浅色
              value: light
            - label: 深色
              value: dark
        - $formkit: color
          name: body_color
          label: 宣纸底色（浅色）
          value: "#fefaf0"
        - $formkit: color
          name: body_color_dark
          label: 夜墨底色（深色）
          value: "#221d17"
        - $formkit: color
          name: text_color
          label: 墨色文字（浅色）
          value: "#2b2620"
        - $formkit: color
          name: text_color_dark
          label: 暖白文字（深色）
          value: "#e8ddc7"
        - $formkit: color
          name: post_frame_color
          label: 卡片背景（浅色）
          value: "#f4ecd8"
        - $formkit: color
          name: post_frame_color_dark
          label: 卡片背景（深色）
          value: "#2f2820"
        - $formkit: color
          name: accent_color
          label: 朱砂强调色（浅色）
          value: "#9c2b1b"
        - $formkit: checkbox
          name: show_grid
          label: 显示网格宣纸底纹
          value: true
    - group: layout
      label: 布局
      formSchema:
        - $formkit: number
          name: page_size
          label: 首页每页文章数
          value: 15
          min: 1
          max: 100
    - group: content
      label: 内容
      formSchema:
        - $formkit: text
          name: license_name
          label: 文章许可名称
          value: "CC BY-NC-ND 4.0"
        - $formkit: text
          name: license_url
          label: 文章许可链接
          value: "https://creativecommons.org/licenses/by-nc-nd/4.0/"
        - $formkit: text
          name: footer_extra
          label: 页脚额外说明
          value: ""
    - group: functional
      label: 功能
      formSchema:
        - $formkit: checkbox
          name: enable_katex
          label: 启用 KaTeX 数学公式
          value: true
