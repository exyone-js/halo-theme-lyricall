apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: halo-theme-lyricall
spec:
  displayName: Lyricall
  author:
    name: exyone
    website: https://blackblog.cz/
  description: A minimalistic platform for poetry, migrated from the Jekyll Lyricall theme.
  logo: /themes/halo-theme-lyricall/assets/images/logo.svg
