<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{layout :: html(head = null, content = ~{::content})}"
>
  <th:block th:with="pageTitle = ${category.spec.displayName}">
    <th:block th:fragment="content">
      <h2 style="text-align:center;" th:text="${category.spec.displayName}"></h2>
      <div class="archive">
        <ul class="archive__list">
          <li class="archive__item" th:each="post : ${posts.items}">
            <time class="archive__date"
              th:text="${#temporals.format(post.spec.publishTime, 'yyyy-M-d')}"></time>
            <a class="archive__title"
              th:href="@{${post.status.permalink}}"
              th:text="${post.spec.title}"></a>
          </li>
        </ul>
      </div>
      <nav class="pagination" th:if="${posts.hasPrevious() || posts.hasNext()}">
        <a th:if="${posts.hasPrevious()}" th:href="@{${posts.prevUrl}}"><b>&larr; 上一页</b></a>
        <a th:if="${posts.hasNext()}" th:href="@{${posts.nextUrl}}"><b>下一页 &rarr;</b></a>
      </nav>
    </th:block>
  </th:block>
</html>
