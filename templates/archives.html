<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{layout :: html(head = null, content = ~{::content})}"
>
  <th:block th:with="pageTitle = '归档', activeTab = '归档'">
    <th:block th:fragment="content">
      <h2 style="text-align:center;">归档</h2>

      <div class="archive">
        <th:block th:each="archive : ${archives.items}">
          <h3 class="archive__year" th:text="${archive.year}"></h3>
          <ul class="archive__list">
            <th:block th:each="month : ${archive.months}">
              <li class="archive__item" th:each="post : ${month.posts}">
                <time class="archive__date"
                  th:text="${#temporals.format(post.spec.publishTime, 'M月d日')}"></time>
                <a
                  class="archive__title"
                  th:href="@{${post.status.permalink}}"
                  th:text="${post.spec.title}"
                ></a>
              </li>
            </th:block>
          </ul>
        </th:block>
      </div>

      <nav class="pagination" th:if="${archives.hasPrevious() || archives.hasNext()}">
        <a th:if="${archives.hasPrevious()}" th:href="@{${archives.prevUrl}}">
          <b>&larr; 上一页</b>
        </a>
        <a th:if="${archives.hasNext()}" th:href="@{${archives.nextUrl}}">
          <b>下一页 &rarr;</b>
        </a>
      </nav>
    </th:block>
  </th:block>
</html>
