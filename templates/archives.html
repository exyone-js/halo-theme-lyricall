<!DOCTYPE html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{layout :: html(head = null, content = ~{::content})}"
>
  <th:block th:with="pageTitle = 'Archives'">
    <th:block th:fragment="content">
      <h2 style="text-align:center;">Archives</h2>
      <th:block th:each="archive : ${archives.items}">
        <h1 th:text="${archive.year}"></h1>
        <ul class="listing">
          <th:block th:each="month : ${archive.months}">
            <li th:each="post : ${month.posts}">
              <a
                th:href="@{${post.status.permalink}}"
                th:text="${post.spec.title}"
              ></a>
            </li>
          </th:block>
        </ul>
      </th:block>
      <div class="pagination" th:if="${archives.hasPrevious() || archives.hasNext()}">
        <a th:if="${archives.hasPrevious()}" th:href="@{${archives.prevUrl}}">
          <b>Previous</b>
        </a>
        <a th:if="${archives.hasNext()}" th:href="@{${archives.nextUrl}}">
          <b>Next</b>
        </a>
      </div>
    </th:block>
  </th:block>
</html>
