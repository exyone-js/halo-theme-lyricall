<!doctype html>
<html xmlns:th="https://www.thymeleaf.org">
  <th:block th:fragment="nav">
    <nav>
      <div class="hide-in-print" th:with="menu = ${menuFinder.getPrimary()}">
        <th:block th:if="${menu != null and not #lists.isEmpty(menu.menuItems)}">
          <th:block th:each="item, stat : ${menu.menuItems}">
            <a
              th:href="@{${item.status.href}}"
              th:target="${item.spec.target?.value}"
            >
              <strong th:if="${#strings.equals(item.status.displayName, activeTab)}" th:text="${item.status.displayName}"></strong>
              <th:block th:unless="${#strings.equals(item.status.displayName, activeTab)}" th:text="${item.status.displayName}"></th:block>
            </a>
            <th:block th:if="${!stat.last}"> · </th:block>
          </th:block>
        </th:block>
        <th:block th:if="${menu == null or #lists.isEmpty(menu.menuItems)}">
          <a th:href="@{/}">Home</a>
        </th:block>
      </div>
    </nav>
  </th:block>
</html>
